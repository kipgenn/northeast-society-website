<!DOCTYPE html>
<html>

<!-- for the system -->
    <head>
        <title>NESociety IITD</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    

    <!-- for the human eye -->
    <body>
        <!-- header -->
        <header>
            <!-- the header -->
            <div class = "g1">
                <img src = "\photos\neslogo.jpg" alt = "NES LOGO">
                <div>
                    <h1>NorthEast Society</h1>
                    <br>
                    <h2>IIT Delhi</h2>
                </div>
            </div>

            <!-- navigation bar part -->
            <nav id = "navigation-bar">
                <button class = "nav-button">GALLERY</button>
                <button class = "nav-button">ABOUT US</button>
                <button class = "nav-button">PAST EVENTS</button>
            </nav>
        </header>


        <main>

            <!-- front photo -->
            <div id = "front-photo">
                <img src = "\photos\mainpic.png", alt = "NES GROUP PHOTO">
            </div>


            <section id = "pres-msg">
                <img src ="\photos\prespic.jpg">
                <div class = "g2">
                    <h2>From the President</h2>
                    <p>
                        HI hope yall fine and the neo fest was good, hoping to meet again.. take care
                    </p>
                </div>

            </section>

            <section id="main-gallery">
                <img src="./photos/p1.jpg">
                <img src="./photos/p2.jpg">
                <img src="./photos/p3.jpg">
                <img src="./photos/p4.jpg">
                <img src="./photos/p5.jpg">
                <img src="./photos/p6.jpg">
            </section>

        </main>


        <footer>
            <p>follow us on social media</p>

        </footer>
    </body>

</html>
